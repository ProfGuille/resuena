services:
  - type: web
    name: lyricmix
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WHISPER_MODEL
        value: small
      - key: PYTHON_VERSION
        value: 3.12.0
