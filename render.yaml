services:
  - type: web
    name: resuena
    runtime: python
    plan: free
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq ffmpeg
      pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: PYTHON_VERSION
        value: 3.12.0
